[project]
name = "api"
version = "0.1.0"
description = "Barebones FastAPI + Postgres template server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["fastapi (>=0.163.0,<0.164.0)", "uvicorn[standard] (>=0.54.0,<0.55.0)", "alembic (>=1.20.1,<2.0.0)", "pydantic-settings (>=2.16.3,<3.0.0)", "sqlalchemy (>=2.1.8,<3.0.0)", "psycopg[binary] (>=3.3.9,<4.0.0)"]

[tool.poetry]
packages = [{ include = "api" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)",
]
