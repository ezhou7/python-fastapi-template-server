[project]
name = "blog-api"
version = "0.1.0"
description = "Barebones FastAPI + Postgres template server for a blog"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["fastapi (>=0.163.0,<0.164.0)", "uvicorn[standard] (>=0.54.0,<0.55.0)", "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)", "asyncpg (>=0.32.0,<0.33.0)", "alembic (>=1.20.1,<2.0.0)", "pydantic-settings (>=2.16.3,<3.0.0)"]

[tool.poetry]
packages = [{ include = "blog_api" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
